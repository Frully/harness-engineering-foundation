name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.1'
          cache-dependency-path: workspace/backend/go.sum

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.12.4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'
          cache-dependency-path: workspace/frontend/pnpm-lock.yaml

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install Linux desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev xvfb libsecret-1-dev libjsoncpp-dev
          flutter config --enable-linux-desktop

      - name: Install Playwright browsers
        run: |
          cd workspace/frontend
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium

      - name: Run harness quality gate
        run: bash harness/scripts/verify.sh

      - name: Upload smoke artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-artifacts
          path: |
            workspace/backend/.artifacts
            workspace/frontend/.artifacts
            workspace/frontend/playwright-report
            workspace/mobile/.artifacts

  android-smoke:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.1'
          cache-dependency-path: workspace/backend/go.sum

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Accept Android licenses
        run: yes | flutter doctor --android-licenses || true

      - name: Run Android emulator smoke
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_6
          emulator-boot-timeout: 900
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash workspace/mobile/android_smoke.sh

      - name: Upload Android smoke artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-smoke-artifacts
          path: workspace/mobile/.artifacts

  release:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    needs:
      - quality-gate
      - android-smoke
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.1'
          cache-dependency-path: workspace/backend/go.sum

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.12.4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'
          cache-dependency-path: workspace/frontend/pnpm-lock.yaml

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        run: |
          docker build -f workspace/backend/Dockerfile -t ghcr.io/${{ github.repository_owner }}/harness-engineering-foundation-backend:${{ github.sha }} .
          docker push ghcr.io/${{ github.repository_owner }}/harness-engineering-foundation-backend:${{ github.sha }}

      - name: Build and push frontend image
        run: |
          docker build -f workspace/frontend/Dockerfile --build-arg VITE_API_BASE_URL= -t ghcr.io/${{ github.repository_owner }}/harness-engineering-foundation-frontend:${{ github.sha }} .
          docker push ghcr.io/${{ github.repository_owner }}/harness-engineering-foundation-frontend:${{ github.sha }}

      - name: Build Flutter APK
        run: |
          cd workspace/mobile
          flutter pub get
          flutter build apk --debug --dart-define=API_BASE_URL=http://127.0.0.1:8080

      - name: Upload Flutter artifact
        uses: actions/upload-artifact@v4
        with:
          name: harness-mobile-apk
          path: workspace/mobile/build/app/outputs/flutter-apk/app-debug.apk
